name: beignets-de-mamie

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beignets
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d beignets"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://app:app_password@database:5432/beignets?serverVersion=16&charset=utf8
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$'
      ADMIN_EMAIL: admin@beignetsdemamie.fr
      ADMIN_PASSWORD: Mamie2026!
    volumes:
      - ./backend:/app
      - api_vendor:/app/vendor
    ports:
      - "8000:80"

  front:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:80
    volumes:
      - ./frontend:/app
      - front_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db_data:
  api_vendor:
  front_node_modules:
